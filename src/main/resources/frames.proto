syntax = "proto3";

//do not change this properties
option java_package = "pl.edu.pwr.pwrinspace.poliwrocket.Model.MessageParser";
option java_outer_classname = "FrameProtos";

message LoRaFrame {
   // --- MCB ---
  optional uint32 mcb_state = 1;
  optional uint32 uptime_ms = 2;                   // ms
  optional int32 flight_time_ms = 3;               // ms
  optional float mcb_batt = 4;
  optional float gps_lat = 5;
  optional float gps_long = 6;
  optional bool gps_sat_ok = 7;                    // >3 = OK
  optional int32 altitude_m = 8;                   // meters
  optional int32 velocity_m_s = 9;                 // m/s
  optional int32 mcb_temperature = 10;
  optional float euler_fi = 11;
  optional float euler_psi = 12;
  optional float euler_theta = 13;

  // --- Recovery ---
  optional fixed32 recovery_byte_data = 14;

  // --- Pitot ---
  optional float pitot_battery = 15;
  optional int32 pitot_altitude = 16;
  optional int32 pitot_velocity = 17;
  optional int32 pitot_temperature = 18;

  // --- Valve states ---
  optional fixed32 main_vent_byte_data =19;

  // --- Byte data ---
  optional fixed32 n2_main_byte_data = 20;
  optional fixed32 eth_n2_vent_byte_data = 21;
  optional fixed32 oxi_main_valve_byte_data = 22;
  optional fixed32 ox_vent_eth_main_byte_data = 23;

  // --- TANWA ---
  optional float tanwa_battery = 24;
  optional int32 tanwa_state = 25;

  optional fixed32 tanwa_can_and_states_byte_data = 26;


  optional float tanwa_thrust = 27;
  optional float tanwa_tank_weight = 28;
  optional float tanwa_temp_post_n2o_fill = 29;
  optional float tanwa_temp_filling_wall = 30;


  optional float tanwa_postfill_n2o_pres = 31;
  optional float tanwa_cutoff_n2o_pres = 32;


  optional float tanwa_droid_n2o_pres = 33;
  optional float tanwa_prereg_n2_pres = 34;


  optional float tanwa_postreg_n2_pres = 35;
  optional float tanwa_postfill_n2_pres = 36;


  optional float tanwa_droid_n2_pres = 37;
  optional float tanwa_combchamber_pres = 38;

  // --- Payload ---
  optional float payload_battery = 39;

  optional fixed32 esp_now_connected_byte_data = 40;
  optional fixed32 esp_now_wkups_byte_data = 41;                  

  // --- Errors ---
  optional fixed32 errors = 42;
}

message LoRaFrameTanwa {
  optional uint32 tanwaState = 1;
  optional uint32 upTime = 2;
  optional int32 engineWorkingTime = 3;

  optional float pressureFuel = 4;
  optional float pressureN2 = 5;
  optional float pressureDroid = 6;
  optional float pressureOxi = 7;

  optional float pressureInjectorFuel = 8;
  optional float pressureInjectorOxi = 9;
  optional float pressureCombustionChamber = 10;

  optional bool statusFillN2O = 11;
  optional bool statusDeprN2O = 12;
  optional bool statusVentN2O = 13;
  optional bool statusArm = 14;
  optional bool igniterCont1 = 15;
  optional bool igniterCont2 = 16;

  optional float tanwaBattery = 17;

  optional float engineThrust = 18;
  optional float rocketWeight = 19;
  optional float tankWeight = 20;

  optional float tempInjector = 21;
  optional float tempCombustionChamber = 22;
  optional float tempExternalTank = 23;


  optional bool statusOxi = 24;
  optional bool statusFuel = 25;
  optional bool statusN2 = 26;
  optional bool statusQdN2O = 27;

  optional bool statusFillN2 = 28;
  optional bool statusDeprN2 = 29;
  optional bool statusQdN2 = 30;
  optional bool statusVentEth = 31;
  optional bool statusVentN2 = 32;

  optional float pressureCutoff = 33;
}

message LoRaSettings {
  optional int32 lora_freq_khz = 1;
  optional int32 lora_transmit_ms = 2;
  optional int32 countdown_time = 3;
  optional int32 ingition_time = 4;
  optional uint32 flash_enable = 5;
  optional uint32 buzzer_enable = 6;
}

message LoRaCommand {
  optional uint32 lora_dev_id = 1;
  optional uint32 sys_dev_id = 2;
  optional uint32 command = 3;
  optional int32 payload = 4;
}